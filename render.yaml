# Alternative host. The main deployment is Vercel (vercel.json), which serves the app and the API together.
# Render Blueprint: deploys only the API in /server as a free web service.
# Render dashboard → New → Blueprint → pick this repository, then fill in the secret values.
services:
  - type: web
    name: ai-cofounder-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://ranjansaurabh03.github.io
      - key: GEMINI_API_KEY
        sync: false # enables the Gemini co-founder (chat and drafts)
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_LIMIT
        value: "300"
